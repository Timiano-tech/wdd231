<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Thank you for submitting your membership application to Tims Chamber of Commerce.">
    <meta name="author" content="Ajayi Oluwatimileyin">
    <title>Tims Chamber of Commerce | Thank You</title>
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/larger.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="images/github.svg">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        .thank-you-panel {
            background: white;
            border: 1px solid rgba(17, 50, 77, 0.14);
            border-radius: 1rem;
            padding: 1.6rem;
            max-width: 900px;
            margin: 0 auto;
            box-shadow: 0 18px 36px rgba(17, 50, 77, 0.08);
        }

        .thank-you-panel h2,
        .thank-you-panel p {
            margin: 0 0 1rem;
        }

        .submission-details {
            display: grid;
            gap: 1rem;
            margin-top: 1rem;
        }

        .submission-detail {
            display: grid;
            gap: 0.2rem;
            padding: 1rem;
            border: 1px solid rgba(17, 50, 77, 0.12);
            border-radius: 0.9rem;
            background: #f8f6ef;
        }

        .submission-detail span {
            color: var(--muted);
        }

        .submission-detail strong {
            color: var(--navy);
        }

        .info-grid {
            display: grid;
            gap: 1rem;
        }

        @media screen and (min-width: 740px) {
            .info-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
    </style>
</head>

<body>
    <header class="site-header">
        <div class="brand">
            Tims Chamber of Commerce
        </div>
        <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav class="main-nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="directory.html">Directory</a>
            <a href="join.html">Join</a>
            <a href="discover.html">Discover</a>
        </nav>
    </header>

    <main>
        <section class="page-intro">
            <p class="eyebrow">Application received</p>
            <h2>Thank you for joining the chamber.</h2>
            <p>We appreciate your interest and look forward to welcoming you as a member. Here is the information you submitted.</p>
        </section>

        <section class="thank-you-panel">
            <div class="info-grid" id="submission-details"></div>
        </section>
    </main>

    <footer>
        <div>
            <p>Tims Chamber of Commerce</p>
        </div>

        <div class="socials">
            <a href="https://github.com/Timiano-tech/wdd231"><img src="images/github.svg" alt="GitHub"></a>
            <a href="https://www.linkedin.com"><img src="images/linkedin.svg" alt="LinkedIn"></a>
            <a href="https://www.facebook.com"><img src="images/facebook.svg" alt="Facebook"></a>
        </div>

        <div>
            <p>&copy; <span id="currentyear"></span> Ajayi Oluwatimileyin WDD 231</p>
        </div>
    </footer>
    <script src="scripts/thankyou.js" defer></script>
</body>

</html>
